name: VPN Gate Node Check

on:
  # 定时检测: 每 30 分钟一次 (cron 用 UTC)。
  # ⚠️ 别用 "*/30"(= :00 与 :30) —— 整点是 GitHub Actions 最拥堵的档, 定时会被延迟甚至丢弃
  # (实测: 用 */30 时 19:30 与 20:00 两班都没触发)。错峰到 :12/:42 可靠得多。
  schedule:
    - cron: "12,42 * * * *"
  # 手动触发 (Actions 页面 -> Run workflow)
  workflow_dispatch:
  # 首次部署: 推送即触发, 无需等定时
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        id: run_check
        run: |
          set -o pipefail
          python vpngate.py 2>&1 | tee "$RUNNER_TEMP/vpngate.log"
        env:
          # 检测端 Worker —— 只被 GitHub Actions（墙外）调用，用 workers.dev 即可，不需要自定义域名
          CHECK_WORKER: "https://ancient-wave-ea1d.qiushi19990909.workers.dev/check?sstp=vpn:vpn@"
          # edgetunnel 入口域名与 UUID —— 设备（墙内）走这个域名连，所以必须放能在墙内用的自定义域名
          EDT_DOMAIN: "jia.baozi.kdns.fr"
          EDT_UUID: "dd66e2e1-b259-4284-abac-b08c7034bd93"
          # 优选IP（CN 直连实测 TOP3，循环分配给各节点作连接地址；host/sni 仍是 EDT_DOMAIN）
          EDT_ADDR: "104.26.0.1,172.67.130.154,104.20.0.1"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Diagnostics (日志公开可读, 无需登录)
        if: always()
        run: |
          {
            echo "### vpngate.py 运行输出"
            echo ''
            echo '```'
            tail -c 15000 "$RUNNER_TEMP/vpngate.log" 2>/dev/null || echo "(无日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 关键日志行同时作为 annotation 输出 (annotation 未登录也能看到)
          echo "--- vpngate.py 尾部日志 ---"
          tail -n 10 "$RUNNER_TEMP/vpngate.log" 2>/dev/null | while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::warning::$line"
            fi
          done

      - name: Configure Pages (首次运行自动开启 Pages)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://yiheweigui82.github.io/jia/ (deploy outcome: ${{ steps.deployment.outcome }})"'
