name: VPN Gate Node Check

on:
  # 定时检测: 每 30 分钟一次 (cron 用 UTC; GitHub 定时任务偶有几分钟延迟属正常)
  schedule:
    - cron: "*/30 * * * *"
  # 手动触发 (Actions 页面 -> Run workflow)
  workflow_dispatch:
  # 首次部署: 推送即触发, 无需等定时
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        id: run_check
        run: |
          set -o pipefail
          python vpngate.py 2>&1 | tee "$RUNNER_TEMP/vpngate.log"
        env:
          # 自己的检测 Worker (ancient-wave-ea1d); 备用域名: https://jia.baozi.kdns.fr/check?sstp=vpn:vpn@
          CHECK_WORKER: "https://ancient-wave-ea1d.qiushi19990909.workers.dev/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Diagnostics (日志公开可读, 无需登录)
        if: always()
        run: |
          {
            echo "### vpngate.py 运行输出"
            echo ''
            echo '```'
            tail -c 15000 "$RUNNER_TEMP/vpngate.log" 2>/dev/null || echo "(无日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 关键日志行同时作为 annotation 输出 (annotation 未登录也能看到)
          echo "--- vpngate.py 尾部日志 ---"
          tail -n 10 "$RUNNER_TEMP/vpngate.log" 2>/dev/null | while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::warning::$line"
            fi
          done

      - name: Configure Pages (首次运行自动开启 Pages)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://yiheweigui82.github.io/jia/ (deploy outcome: ${{ steps.deployment.outcome }})"'
