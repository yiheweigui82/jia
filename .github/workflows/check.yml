name: VPN Gate Node Check

on:
  # 定时检测: 每 30 分钟一次 (cron 用 UTC; GitHub 定时任务偶有几分钟延迟属正常)
  schedule:
    - cron: "*/30 * * * *"
  # 手动触发 (Actions 页面 -> Run workflow)
  workflow_dispatch:
  # 首次部署: 推送即触发, 无需等定时
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 检测统一走这个 Worker (如需换成自己的 Worker, 改这一行即可)
          CHECK_WORKER: "https://check.helei.kdns.fr/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Configure Pages (首次运行自动开启 Pages)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://yiheweigui82.github.io/jia/ (deploy outcome: ${{ steps.deployment.outcome }})"'
